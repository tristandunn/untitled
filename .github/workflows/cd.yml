name: CD

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  workflow_call:

jobs:
  Build:
    uses: ./.github/workflows/ci.yml

  Deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: Build
    concurrency:
      group: cd-production
    env:
      DESTINATION: production
    permissions:
      packages: write

    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Ruby
        uses: ruby/setup-ruby@984c0c890880bbf811283d6f09c4607c62d210a4 # v1.323.0
        with:
          bundler-cache: true

      - name: Start the SSH agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
            ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Deploy the application
        shell: bash
        env:
          ${{ insert }}: ${{ secrets }}
          DOCKER_BUILDKIT: 1
        run: bin/kamal deploy --destination=$DESTINATION

      - name: Release the Kamal lock, if needed
        shell: bash
        if: ${{ cancelled() || failure() }}
        run: bin/kamal lock release --destination=$DESTINATION
